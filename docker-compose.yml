services:
  backend:
    build: .
    ports: ["8000:8000"]
    environment:
      MYTHARA_DATABASE_URL: postgresql+psycopg://mythara:mythara@postgres:5432/mythara
      MYTHARA_REDIS_URL: redis://redis:6379/0
      MYTHARA_QDRANT_URL: http://qdrant:6333
      MYTHARA_NEO4J_URI: bolt://neo4j:7687
      MYTHARA_NEO4J_USER: neo4j
      MYTHARA_NEO4J_PASSWORD: mythara_password
    depends_on: [postgres, redis, qdrant, neo4j]
    volumes:
      - ./knowledge:/app/knowledge
      - ./storage:/app/storage
      - ./logs:/app/logs
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mythara
      POSTGRES_USER: mythara
      POSTGRES_PASSWORD: mythara
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/mythara_password
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
