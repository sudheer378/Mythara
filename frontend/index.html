<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Mythara AI Studio</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <main>
    <h1>Mythara AI Studio</h1>
    <section><h2>Chat</h2><textarea id="question" placeholder="Ask canon..."></textarea><button onclick="ask()">Ask</button><pre id="answer"></pre><audio id="audio" controls></audio></section>
    <section><h2>Mythral Creator</h2><input id="name" placeholder="Name"><input id="type" placeholder="Type"><input id="class" placeholder="Class"><button onclick="createMythral()">Create Draft</button><pre id="draft"></pre></section>
    <section><h2>Approval Panel</h2><input id="draftPath" placeholder="Draft path"><button onclick="approve()">Approve</button><pre id="approval"></pre></section>
    <section><h2>Encyclopedia</h2><input id="search" placeholder="Search"><button onclick="searchEnc()">Search</button><pre id="results"></pre></section>
  </main><script src="app.js"></script>
</body></html>
