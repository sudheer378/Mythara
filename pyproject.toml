[project]
name = "mythara-ai-studio"
version = "0.1.0"
description = "Personal AI creative operating system for Mythara canon workflows"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.1.18",
  "alembic>=1.13.1",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
test = ["pytest>=8.2.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
